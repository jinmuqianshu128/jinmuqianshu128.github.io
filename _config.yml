# ===========================================================================
# Hexo 站点主配置
# 主题配置见 _config.butterfly.yml
# ===========================================================================

# --- 站点信息 ---------------------------------------------------------------
title: 铁树不开花
subtitle: 'PVZ汉化版助手 · 音乐解锁 · 技术笔记'
description: 'PVZ汉化版助手与音乐解锁的发布站点，也是一名在校高中生的技术笔记。'
keywords: 'PVZ汉化版助手,植物大战僵尸辅助,PVZ修改器,音乐解锁,铁树不开花,个人博客'
author: 铁树不开花
language: zh-CN
timezone: 'Asia/Shanghai'

# --- 网址 -------------------------------------------------------------------
# GitHub Pages 的实际地址；若日后启用自定义域名，改这里即可
url: https://jinmuqianshu128.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# --- 目录 -------------------------------------------------------------------
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

# 这些路径下的文件原样复制，交给 Hexo 渲染反而会出错
skip_render:
  # 音乐解锁应用的构建产物：整体原样复制，交给 Hexo 处理反而会出错
  - 'music/css/**'
  - 'music/js/**'
  - 'music/fonts/**'
  - 'music/*.js'
  - 'music/*.json'
  # 旧地址跳转页：原样复制，不要被主题套上外壳
  - 'tools/tstools.html'
  # 站点自有资源与本地化的第三方库
  - 'assets/**'
  - 'pluginsSrc/**'
  - 'index1.html'
  - 'index2.html'
  - '404.html'
  - 'baidu_verify_*.html'
  - 'BingSiteAuth.xml'

# --- 写作 -------------------------------------------------------------------
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false

# --- 首页 -------------------------------------------------------------------
index_generator:
  path: ''
  per_page: 10
  order_by: -date

default_category: 随笔
category_map:
tag_map:

# --- 日期格式 ---------------------------------------------------------------
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# --- 分页 -------------------------------------------------------------------
per_page: 10
pagination_dir: page

# --- 主题 -------------------------------------------------------------------
theme: butterfly

# 部署交给 GitHub Actions（见 .github/workflows/pages.yml），此处留空
deploy:
  type: ''

# --- 插件 -------------------------------------------------------------------
# Butterfly 的本地搜索读取此文件
search:
  path: search.xml
  field: post
  content: true
  template:

sitemap:
  path: sitemap.xml

feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
